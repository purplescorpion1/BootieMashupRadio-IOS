name: Build iOS & tvOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Bootie Mashup Radio (iOS & tvOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # --- 1. iOS Simulator Build ---
      - name: Build iOS Simulator Application
        run: |
          xcodebuild build \
            -project BootieMashupRadio.xcodeproj \
            -scheme BootieMashupRadio \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR=build

      - name: Package iOS Simulator App into ZIP
        run: |
          cd build/Release-iphonesimulator && zip -r ../BootieMashupRadio-iOS-Simulator.zip "Bootie Mashup Radio.app"

      # --- 2. iOS Device Build ---
      - name: Build iOS Device Application
        run: |
          xcodebuild build \
            -project BootieMashupRadio.xcodeproj \
            -scheme BootieMashupRadio \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR=build

      - name: Package iOS Device App into IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/Release-iphoneos/Bootie Mashup Radio.app" build/Payload/
          cd build && zip -r BootieMashupRadio-iOS-Device.ipa Payload

      # --- 3. tvOS Simulator Build ---
      - name: Build tvOS Simulator Application
        run: |
          xcodebuild build \
            -project BootieMashupRadio.xcodeproj \
            -scheme BootieMashupRadioTV \
            -sdk appletvsimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR=build

      - name: Package tvOS Simulator App into ZIP
        run: |
          cd build/Release-appletvsimulator && zip -r ../BootieMashupRadio-tvOS-Simulator.zip "Bootie Mashup Radio TV.app"

      # --- 4. tvOS Device Build ---
      - name: Build tvOS Device Application
        run: |
          xcodebuild build \
            -project BootieMashupRadio.xcodeproj \
            -scheme BootieMashupRadioTV \
            -sdk appletvos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR=build

      - name: Package tvOS Device App into IPA
        run: |
          mkdir -p build/PayloadTV
          cp -r "build/Release-appletvos/Bootie Mashup Radio TV.app" build/PayloadTV/Payload
          cd build/PayloadTV && zip -r ../BootieMashupRadio-tvOS-Device.ipa Payload

      # --- Upload Artifacts ---
      - name: Upload iOS Simulator App (.zip)
        uses: actions/upload-artifact@v4.4.3
        with:
          name: BootieMashupRadio-iOS-Simulator
          path: build/BootieMashupRadio-iOS-Simulator.zip

      - name: Upload iOS Device App (.ipa)
        uses: actions/upload-artifact@v4.4.3
        with:
          name: BootieMashupRadio-iOS-Device
          path: build/BootieMashupRadio-iOS-Device.ipa

      - name: Upload tvOS Simulator App (.zip)
        uses: actions/upload-artifact@v4.4.3
        with:
          name: BootieMashupRadio-tvOS-Simulator
          path: build/BootieMashupRadio-tvOS-Simulator.zip

      - name: Upload tvOS Device App (.ipa)
        uses: actions/upload-artifact@v4.4.3
        with:
          name: BootieMashupRadio-tvOS-Device
          path: build/BootieMashupRadio-tvOS-Device.ipa
